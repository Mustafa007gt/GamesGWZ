*{

}

body{
background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
min-height:100vh;

display:flex;
flex-direction: column;
justify-content:center;
align-items:center;

padding:20px;

overflow-x:hidden;
position: relative;
}

/* توهجات خلفية جمالية متطورة */
body::before{
content:"";
position:fixed;
top:-150px;
left: 10%;
width:450px;
height:450px;
background:radial-gradient(circle, rgba(139,92,246,0.18) 0%, rgba(0,0,0,0) 70%);

pointer-events: none;
z-index: 1;
}

body::after{
content:"";
position:fixed;
bottom:-150px;
right: 10%;
width:450px;
height:450px;
background:radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(0,0,0,0) 70%);
border-radius:50%;
pointer-events: none;
z-index: 1;

/* تنسيق الشريط الإعلاني المتحرك */
.announcement-bar {
width: 100%;
max-width: 430px;
background: linear-gradient(135deg, #8b5cf6, #3b82f6);
color: white;
padding: 10px 15px;
border-radius: 12px;
margin-bottom: 15px;
font-size: 14px;
font-weight: bold;
box-shadow: 0 10px 20px rgba(0,0,0,0.3);
position: relative;
z-index: 2;
overflow: hidden;
display: flex;
align-items: center;
}

.announcement-bar marquee {
width: 100%;
}

.card{

width:100%;
max-width:430px;

background:rgba(31, 41, 55, 0.85);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);

border: 1px solid rgba(255, 255, 255, 0.08);
border-radius:22px;

overflow:hidden;

/* تأثير التوهج والانتقال الناعم للبطاقة */
box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 0 rgba(139, 92, 246, 0);
transition: transform 0.4s ease, box-shadow 0.4s ease, border-color 0.4s ease;

position:relative;
z-index:2;

}

/* تأثير التوهج عند تمرير الماوس على البطاقة */
.card:hover {
transform: translateY(-5px);
border-color: rgba(139, 92, 246, 0.4);
box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 25px rgba(139, 92, 246, 0.25);
}

.slider{

position:relative;

height:240px;

overflow:hidden;

}

/* تعديل لعنصر السلايد سواء كان صورة أو فيديو */
.slide{

position:absolute;

width:100%;
height:100%;

object-fit:cover;

opacity:0;

transition:.5s;

}

.slide.active{

opacity:1;

}

/* تخصيص حاوية الفيديو ليطابق أبعاد السلايدر */
.slide iframe {
width: 100%;
height: 100%;
border: none;
object-fit: cover;
position: relative;
z-index: 2;
}

.prev,
.next{

position:absolute;

top:50%;

transform:translateY(-50%);

width:36px;
height:36px;

border:none;

border-radius:50%;

background:rgba(0,0,0,0.6);

color:white;

font-size:20px;

cursor:pointer;

z-index: 10; /* جعلناها أسفل الفيديو لكي لا تحجب زر التشغيل */

transition: background 0.3s ease, transform 0.2s ease;
}

.prev:hover,
.next:hover {
background: rgba(139, 92, 246, 0.9);
transform: translateY(-50%) scale(1.08);
}

.prev{

right:8px;

}

.next{

left:8px;

}

.dots{

position:absolute;

bottom:10px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:8px;

z-index: 3;

}

.dot{

width:10px;
height:10px;

background:#777;

border-radius:50%;

transition:.3s;
cursor: pointer;
}

.dot:hover {
background: #a78bfa;
}

.dot.active{

background:#8b5cf6;
width: 20px;
border-radius: 6px;

}

.content{

padding:22px;

}

h1{

color:white;

text-align:center;

margin-bottom:20px;

font-size:28px;

text-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);

}

.info{

background:#111827;

border-radius:15px;

overflow:hidden;

margin-bottom:20px;

border: 1px solid rgba(255, 255, 255, 0.04);

}

.row{

display:flex;

justify-content:space-between;
align-items:center;

padding:16px;

border-bottom:1px solid #2b3548;

color:white;

font-size:17px;

transition: background 0.3s ease;
}

/* تأثير تفاعلي خفيف عند المرور على صفوف المعلومات */
.row:hover {
background: rgba(17, 24, 39, 0.8);
padding-right: 20px;
padding-left: 20px;
}

.row:last-child{

}

.label{

font-weight:bold;

color:#cbd5e1;

display: flex;

align-items:center;

gap: 10px;

}

.label svg {

width: 20px;

height: 20px;

fill: #8b5cf6;

transition: transform 0.3s ease;
}

/* حركة بسيطة للأيقونة عند المرور على السطر */
.row:hover .label svg {
transform: scale(1.2);
}

.buttons{

display:flex;

flex-direction:column;

gap:12px;

}

.download,

justify-content:center;

align-items:center;

text-decoration:none;

border:none;

border-radius:14px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

}

.download{

.download:hover{

.copy{

.copy:hover{

.toast{

position:fixed;

bottom:25px;

left:50%;

transform:translateX(-50%);

background:#22c55e;

color:white;

padding:14px 20px;

border-radius:12px;

font-weight:bold;

display:none;

z-index:999;

</style>

<script>

const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

let current = 0;

function showSlide(index){
    slides.forEach((slide)=>{
        slide.classList.remove("active");
    });
    dots.forEach((dot)=>{
        dot.classList.remove("active");
    });
    slides[index].classList.add("active");
    dots[index].classList.add("active");
}

function nextSlide(){
    current++;
    if(current >= slides.length){
        current = 0;
    }
    showSlide(current);
}

function prevSlide(){
    current--;
    if(current < 0){
        current = slides.length - 1;
    }
    showSlide(current);
}

document.querySelector(".next").onclick = nextSlide;
document.querySelector(".prev").onclick = prevSlide;

dots.forEach((dot,index)=>{
    dot.onclick = ()=>{
        current = index;
        showSlide(current);
    };
});

function copyLink(){
    navigator.clipboard.writeText("https://modsfire.com/MMcDcau4rFACt61");
    const toast = document.getElementById("toast");
    toast.style.display = "block";
    setTimeout(()=>{
        toast.style.display = "none";
    },2000);
}

</script>
