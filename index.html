<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اسم اللعبة</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#0b1220,#172554,#1e1b4b);
min-height:100vh;

display:flex;
justify-content:center;
align-items:flex-start;

padding:25px;

overflow-x:hidden;

}

body::before{

content:"";

position:fixed;

top:-180px;
right:-180px;

width:420px;
height:420px;

background:#8b5cf620;

border-radius:50%;

filter:blur(100px);

}

body::after{

content:"";

position:fixed;

bottom:-180px;
left:-180px;

width:380px;
height:380px;

background:#3b82f620;

border-radius:50%;

filter:blur(100px);

}

.card{

width:100%;
max-width:430px;

background:#1f2937;

border-radius:22px;

overflow:hidden;

box-shadow:0 20px 45px rgba(0,0,0,.45);

position:relative;
z-index:2;

}

.slider{

position:relative;

height:240px;

overflow:hidden;

}

.slide{

position:absolute;

width:100%;
height:100%;

object-fit:cover;

opacity:0;

transition:.5s;

}

.slide.active{

opacity:1;

}

.prev,
.next{

position:absolute;

top:50%;

transform:translateY(-50%);

width:42px;
height:42px;

border:none;

border-radius:50%;

background:rgba(0,0,0,.45);

color:white;

font-size:24px;

cursor:pointer;

z-index:5;

}

.prev{

right:12px;

}

.next{

left:12px;

}

.dots{

position:absolute;

bottom:15px;

left:50%;

transform:translateX(-50%);

display:flex;

gap:8px;

}

.dot{

width:10px;
height:10px;

background:#777;

border-radius:50%;

transition:.3s;

}

.dot.active{

background:#8b5cf6;

}

.content{

padding:22px;

}

h1{

color:white;

text-align:center;

margin-bottom:20px;

font-size:28px;

}

.info{

background:#111827;

border-radius:15px;

overflow:hidden;

margin-bottom:20px;

}

.row{

display:flex;

justify-content:space-between;

padding:16px;

border-bottom:1px solid #2b3548;

color:white;

font-size:17px;

}

.row:last-child{

border:none;

}

.label{

font-weight:bold;

color:#cbd5e1;

}

.buttons{

display:flex;

flex-direction:column;

gap:12px;

}

.download,
.copy{

height:55px;

display:flex;

justify-content:center;

align-items:center;

text-decoration:none;

border:none;

border-radius:14px;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.25s;

}

.download{

background:linear-gradient(135deg,#8b5cf6,#6d28d9);

color:white;

}

.download:hover{

transform:translateY(-2px);

}

.copy{

background:#334155;

color:white;

}

.copy:hover{

background:#475569;

}

.toast{

position:fixed;

bottom:25px;

left:50%;

transform:translateX(-50%);

background:#22c55e;

color:white;

padding:14px 20px;

border-radius:12px;

font-weight:bold;

display:none;

z-index:999;

}

</style>

</head>

<body>

<div class="card">

<!-- هنا راح نحط السلايدر بالجزء الثاني -->
<div class="slider">

    <img class="slide active" src="https://i.ibb.co/SXH8C2sw/Screenshot-edit-55704712053541.jpg">

    <img class="slide" src="https://i.ibb.co/NnpCMPZk/Screenshot-edit-55678531377822.jpg">

    <img class="slide" src="https://i.ibb.co/JjMkVJxM/Screenshot-edit-55696055329430.jpg">

    <button class="prev">&#10094;</button>

    <button class="next">&#10095;</button>

    <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>

</div>
<!-- وهنا المعلومات بالجزء الثالث -->
<div class="content">

    <h1>GTA SAN ANDREAS</h1>

    <div class="info">

        <div class="row">
            <span class="label">📦 حجم اللعبة</span>
            <strong>2 GB</strong>
        </div>

        <div class="row">
            <span class="label">📱 الأجهزة المدعومة</span>
            <strong>Android 10+</strong>
        </div>

        <div class="row">
            <span class="label">🎮 نوع اللعبة</span>
            <strong>عالم مفتوح - أكشن</strong>
        </div>

        <div class="row">
            <span class="label">🌐 الإنترنت</span>
            <strong>غير مطلوب</strong>
        </div>

    </div>

    <div class="buttons">

        <a class="download"
           href="https://modsfire.com/MMcDcau4rFACt61"
           target="_blank">
            ⬇ تحميل اللعبة
        </a>

        <button class="copy" onclick="copyLink()">
            📋 نسخ الرابط
        </button>

    </div>

</div>
</div>

<div class="toast" id="toast">
✅ تم نسخ الرابط
</div>
    <script>

const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

let current = 0;

function showSlide(index){

slides.forEach(slide=>slide.classList.remove("active"));
dots.forEach(dot=>dot.classList.remove("active"));

slides[index].classList.add("active");
dots[index].classList.add("active");

}

function nextSlide(){

current++;

if(current>=slides.length) current=0;

showSlide(current);

}

function prevSlide(){

current--;

if(current<0) current=slides.length-1;

showSlide(current);

}

document.querySelector(".next").onclick=nextSlide;
document.querySelector(".prev").onclick=prevSlide;

dots.forEach((dot,index)=>{

dot.onclick=()=>{

current=index;

showSlide(current);

}

});

setInterval(nextSlide,3000);

function copyLink(){

navigator.clipboard.writeText("https://modsfire.com/MMcDcau4rFACt61");

const toast=document.getElementById("toast");

toast.style.display="block";

setTimeout(()=>{

toast.style.display="none";

},2000);

}

</script>

</body>
</html>
