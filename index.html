<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA-SAN-ANDREAS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#0B1220,#172554,#1E1B4B);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
position:relative;

}

  body::before{
content:"";
position:fixed;
top:-200px;
right:-200px;
width:450px;
height:450px;
background:rgba(139,92,246,.15);
border-radius:50%;
filter:blur(100px);
}

body::after{
content:"";
position:fixed;
bottom:-200px;
left:-200px;
width:400px;
height:400px;
background:rgba(59,130,246,.12);
border-radius:50%;
filter:blur(100px);
}

  .slider{

position:relative;
overflow:hidden;

}

.slides{

position:relative;

}

.slide{

display:none;
width:100%;
height:240px;
object-fit:cover;

}

.slide.active{

display:block;

animation:fade .4s;

}

@keyframes fade{

from{
opacity:.4;
}

to{
opacity:1;
}

}

.nav{

position:absolute;
top:50%;
transform:translateY(-50%);

width:42px;
height:42px;

border:none;
border-radius:50%;

background:rgba(0,0,0,.45);

color:#fff;

font-size:22px;

cursor:pointer;

z-index:10;

}

.prev{

right:10px;

}

.next{

left:10px;

}

.dots{

display:flex;
justify-content:center;
gap:8px;

padding:15px;

}

.dot{

width:10px;
height:10px;

border-radius:50%;

background:#555;

}

.dot.active{

background:#8B5CF6;

}
  
.buttons{
display:flex;
flex-direction:column;
gap:12px;
}

.download,
.copy{

display:flex;
justify-content:center;
align-items:center;

height:55px;

border:none;
border-radius:14px;

font-size:18px;
font-weight:bold;

text-decoration:none;

cursor:pointer;

transition:.25s;

}

.download{

background:linear-gradient(135deg,#8B5CF6,#6D28D9);
color:white;

}

.download:hover{

transform:translateY(-2px);

}

.copy{

background:#334155;
color:white;

}

.copy:hover{

background:#475569;
transform:translateY(-2px);

}
.card{
width:100%;
max-width:430px;
background:rgba(31,41,55,.9);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.08);
border-radius:22px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.45);
position:relative;
z-index:1;
}

.card img{
width:100%;
display:block;
}

.content{
padding:20px;
}

h1{
text-align:center;
color:white;
margin-bottom:20px;
}

.info{
background:#111827;
border-radius:12px;
overflow:hidden;
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
padding:15px;
color:white;
border-bottom:1px solid #2b3548;
font-size:17px;
}

.row:last-child{
border-bottom:none;
}

.row span:first-child{
color:#9CA3AF;
}

.download{
display:block;
text-align:center;
background:#8B5CF6;
color:white;
text-decoration:none;
padding:16px;
border-radius:12px;
font-size:20px;
font-weight:bold;
transition:.3s;
}

.download:hover{
background:#7C3AED;
}

</style>

</head>

<body>

<div class="slider">

<button class="nav prev">&#10094;</button>

<div class="slides">

<img src="https://i.ibb.co/SXH8C2sw/Screenshot-edit-55704712053541.jpg" class="slide active">

<img src="https://i.ibb.co/NnpCMPZk/Screenshot-edit-55678531377822.jpg" class="slide">

<img src="https://i.ibb.co/JjMkVJxM/Screenshot-edit-55696055329430.jpg" class="slide">


</div>

<button class="nav next">&#10095;</button>

</div>

<div class="dots">
<span class="dot active"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
</div>
  
  <div class="content">

<h1>GTA SAN ANDREAS</h1>

<div class="info">

<div class="row">
<span>📦 حجم اللعبة</span>
<strong>2 GB</strong>
</div>

<div class="row">
<span>📱 الأجهزة المدعومة</span>
<strong>Android 10+</strong>
</div>

<div class="row">
<span>🎮 نوع اللعبة</span>
<strong>عالم مفتوح - أكشن</strong>
</div>

<div class="row">
<span>🌐 الإنترنت</span>
<strong>غير مطلوب</strong>
</div>

</div>

<div class="buttons">

<a class="download"
href="https://modsfire.com/MMcDcau4rFACt61"
target="_blank">
⬇ تحميل اللعبة
</a>

<button class="copy" onclick="copyLink()">
📋 نسخ الرابط
</button>

</div>

</div>

</div>
<script>

function copyLink(){

navigator.clipboard.writeText("https://modsfire.com/MMcDcau4rFACt61");

const toast=document.createElement("div");

toast.innerHTML="✅ تم نسخ الرابط";

toast.style.position="fixed";
toast.style.bottom="25px";
toast.style.left="50%";
toast.style.transform="translateX(-50%)";
toast.style.background="#22c55e";
toast.style.color="#fff";
toast.style.padding="14px 22px";
toast.style.borderRadius="12px";
toast.style.fontWeight="bold";
toast.style.boxShadow="0 10px 25px rgba(0,0,0,.3)";
toast.style.zIndex="9999";

document.body.appendChild(toast);

setTimeout(()=>{
toast.remove();
},2000);

}

</script>
  <script>

const slides=document.querySelectorAll(".slide");

const dots=document.querySelectorAll(".dot");

let index=0;

function showSlide(i){

slides.forEach(s=>s.classList.remove("active"));

dots.forEach(d=>d.classList.remove("active"));

slides[i].classList.add("active");

dots[i].classList.add("active");

}

function nextSlide(){

index++;

if(index>=slides.length){

index=0;

}

showSlide(index);

}

function prevSlide(){

index--;

if(index<0){

index=slides.length-1;

}

showSlide(index);

}

document.querySelector(".next").onclick=nextSlide;

document.querySelector(".prev").onclick=prevSlide;

setInterval(nextSlide,3000);

  </script>
</body>

</html>
