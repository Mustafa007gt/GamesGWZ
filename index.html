<title>Resident Evil 4</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:430px;
background:#1F2937;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.4);
}

.card img{
width:100%;
display:block;
}

.content{
padding:20px;
}

h1{
text-align:center;
color:white;
margin-bottom:20px;
}

.info{
background:#111827;
border-radius:12px;
overflow:hidden;
margin-bottom:20px;
}

.row{
display:flex;
justify-content:space-between;
padding:15px;
color:white;
border-bottom:1px solid #2b3548;
font-size:17px;
}

.row:last-child{
border-bottom:none;
}

.row span:first-child{
color:#9CA3AF;
}

.download{
display:block;
text-align:center;
background:#8B5CF6;
color:white;
text-decoration:none;
padding:16px;
border-radius:12px;
font-size:20px;
font-weight:bold;
transition:.3s;
}

.download:hover{
background:#7C3AED;
}

</style>
