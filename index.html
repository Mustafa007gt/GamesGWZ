<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اسم اللعبة</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.card{

width:100%;
max-width:420px;
background:#1e293b;
border-radius:20px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,.5);

}

.card img{

width:100%;
display:block;

}

.content{

padding:20px;

}

h1{

text-align:center;
color:#fff;
margin-bottom:15px;

}

.size{

background:#334155;
padding:15px;
border-radius:10px;
text-align:center;
color:white;
font-size:18px;
margin-bottom:20px;

}

.download{

display:block;
background:#8b5cf6;
color:white;
text-decoration:none;
text-align:center;
padding:16px;
border-radius:12px;
font-size:20px;
font-weight:bold;
transition:.3s;

}

.download:hover{

background:#7c3aed;

}

</style>

</head>

<body>

<div class="card">

<img src="https://i.ibb.co/xxxxxxxx/game.jpg">

<div class="content">

<h1>Resident Evil 4</h1>

<div class="size">

📦 حجم اللعبة : 2.4 GB

</div>

<a class="download"

href="https://ضع-رابط-التحميل-هنا"

target="_blank">

⬇ تحميل اللعبة

</a>

</div>

</div>

</body>

</html>
